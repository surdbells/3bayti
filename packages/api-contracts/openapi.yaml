openapi: 3.1.0
info:
  title: 3bayti API
  description: |
    The new platform API for 3bayti. Replaces the legacy PHP backend at
    `api.3bayti.ae` over the M0–M5 migration.

    This file is the single source of truth for the API contract. Generated
    initially by hand (M0.4); from M1 onward it's auto-generated by `swagger-php`
    from annotations in `apps/api/src/`. Frontend types in `src/generated.ts`
    are produced by `openapi-typescript` from this file.
  version: 0.0.1
  contact:
    name: 3bayti engineering
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api-v3.3bayti.ae
    description: Staging / production (M1–M4)
  - url: https://api.3bayti.ae
    description: Production (post-M5 cutover)

paths:
  /v3/health:
    get:
      summary: Service health probe
      description: |
        Returns 200 OK when the API is responsive. Does NOT check downstream
        dependencies (database, Redis) — that's a separate `/v3/health/deep`
        endpoint planned for M5 hardening.
      operationId: getHealth
      tags:
        - System
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: 3bayti-api
        version:
          type: string
          example: dev
        timestamp:
          type: string
          format: date-time

tags:
  - name: System
    description: Health, version, diagnostic endpoints
