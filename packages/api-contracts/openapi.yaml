openapi: 3.1.0
info:
  title: 3bayti API
  description: |
    The new platform API for 3bayti. Replaces the legacy PHP backend at
    `api.3bayti.ae` over the M0-M5 migration.

    This file is the single source of truth for the API contract. Generated
    initially by hand (M0.4); from M1 onward it's auto-generated by `swagger-php`
    from annotations in `apps/api/src/`. Frontend types in `src/generated.ts`
    are produced by `openapi-typescript` from this file.

    M2.2 update (Day 3 of 10-day rollout): catalog endpoints added.
  version: 0.0.2
  contact:
    name: 3bayti engineering

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api-v3.3bayti.ae
    description: Staging / production (M1-M4)
  - url: https://api.3bayti.ae
    description: Production (post-M5 cutover)

paths:
  /v3/health:
    get:
      summary: Service health probe
      description: |
        Returns 200 OK when the API is responsive. Does NOT check downstream
        dependencies (database, Redis) — that's a separate `/v3/health/deep`
        endpoint planned for M5 hardening.
      operationId: getHealth
      tags:
        - System
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v3/products:
    get:
      tags: [Catalog]
      summary: List products (paginated, filterable)
      description: |
        Returns active products. Supports filters via query string and
        cursor-style pagination via limit + offset. Default sort is
        `newest` (created_at DESC, id DESC tiebreak).
      parameters:
        - in: query
          name: vendor
          schema: { type: string }
          description: Filter by vendor slug
        - in: query
          name: category
          schema: { type: string }
          description: Filter by category slug
        - in: query
          name: min_price
          schema: { type: number, format: float }
        - in: query
          name: max_price
          schema: { type: number, format: float }
        - in: query
          name: featured
          schema: { type: boolean }
        - in: query
          name: new
          schema: { type: boolean }
        - in: query
          name: sale
          schema: { type: boolean }
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, oldest, price_asc, price_desc]
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListEnvelope'

  /v3/products/{slug}:
    get:
      tags: [Catalog]
      summary: Get one product by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailEnvelope'
        '404':
          description: Product not found or inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v3/categories:
    get:
      tags: [Catalog]
      summary: Category tree
      responses:
        '200':
          description: OK

  /v3/categories/{slug}:
    get:
      tags: [Catalog]
      summary: Category detail with direct children
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '404':
          description: Category not found

  /v3/vendors:
    get:
      tags: [Catalog]
      summary: List active vendors
      responses:
        '200':
          description: OK

  /v3/vendors/{slug}:
    get:
      tags: [Catalog]
      summary: Vendor detail
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '404':
          description: Vendor not found

  /v3/vendors/{slug}/products:
    get:
      tags: [Catalog]
      summary: List products for a single vendor
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListEnvelope'
        '404':
          description: Vendor not found or inactive

  /v3/sitemap-data:
    get:
      tags: [Catalog]
      summary: Build-time sitemap data
      description: |
        Returns flat lists of active categories, products, vendors with
        slug + last_modified. Used by apps/web's generate-sitemap.mjs.

        NOT wrapped in `{ data, meta }` envelope — script reads object
        properties directly. This is the only intentional v3 endpoint
        that doesn't use the standard envelope.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitemapData'

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: 3bayti-api
        version:
          type: string
          example: dev
        timestamp:
          type: string
          format: date-time

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: float
        currency:
          type: string
          example: AED

    ApiImage:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        alt:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true

    VendorRef:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string

    Product:
      type: object
      required: [id, slug, name, price, in_stock]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        sku:
          type: string
          nullable: true
        price:
          $ref: '#/components/schemas/Money'
        sale_price:
          $ref: '#/components/schemas/Money'
          nullable: true
        primary_image:
          $ref: '#/components/schemas/ApiImage'
          nullable: true
        category_slug:
          type: string
          nullable: true
        vendor:
          $ref: '#/components/schemas/VendorRef'
          nullable: true
        rating:
          type: number
          format: float
          nullable: true
        review_count:
          type: integer
        in_stock:
          type: boolean
        is_new:
          type: boolean
        is_bestseller:
          type: boolean

    ProductSize:
      type: object
      required: [label, in_stock]
      properties:
        label:
          type: string
        in_stock:
          type: boolean

    ProductColor:
      type: object
      required: [label, in_stock]
      properties:
        label:
          type: string
        hex_code:
          type: string
          nullable: true
        in_stock:
          type: boolean

    ProductReview:
      type: object
      required: [id, rating, body, author]
      properties:
        id:
          type: integer
        rating:
          type: number
          format: float
        title:
          type: string
          nullable: true
        body:
          type: string
        author:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        verified:
          type: boolean

    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required: [description, images]
          properties:
            description:
              type: string
            images:
              type: array
              items: { $ref: '#/components/schemas/ApiImage' }
            sizes:
              type: array
              items: { $ref: '#/components/schemas/ProductSize' }
            colors:
              type: array
              items: { $ref: '#/components/schemas/ProductColor' }
            fabric:
              type: string
              nullable: true
            care_instructions:
              type: string
              nullable: true
            materials:
              type: array
              items: { type: string }
            related_products:
              type: array
              items: { $ref: '#/components/schemas/Product' }
            recent_reviews:
              type: array
              items: { $ref: '#/components/schemas/ProductReview' }

    PaginationMeta:
      type: object
      required: [total, limit, offset, has_more]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean

    ProductListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ProductDetailEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ProductDetail'

    SitemapEntry:
      type: object
      required: [slug, last_modified]
      properties:
        slug:
          type: string
        last_modified:
          type: string
          format: date-time

    SitemapData:
      type: object
      required: [categories, products, vendors]
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/SitemapEntry' }
        products:
          type: array
          items: { $ref: '#/components/schemas/SitemapEntry' }
        vendors:
          type: array
          items: { $ref: '#/components/schemas/SitemapEntry' }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

tags:
  - name: System
    description: Health, version, diagnostic endpoints
  - name: Catalog
    description: Public catalog reads (products, categories, vendors, sitemap)
