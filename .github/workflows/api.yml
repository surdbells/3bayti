name: API — build & test

# Build, lint, and test apps/api (Slim 4 + Doctrine 3 PHP backend).
#
# Two jobs:
#   - test    runs on every push + PR — never skipped
#   - deploy  runs only on push to main, ONLY when the
#             ENABLE_AUTO_DEPLOY repo VARIABLE is 'true' (note:
#             variable, not secret — secrets can't be referenced in
#             if: conditionals). See docs/deploy/m1.5-runbook-aapanel.md
#             for setup.

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'
  # M1.6.3.C — manual trigger from GitHub UI / API.
  # Useful for redeploys without committing (e.g., to pick up an
  # env file change made directly on the server).
  workflow_dispatch:

# Workflow-level concurrency.
#
# We deliberately set cancel-in-progress=true at the workflow level:
# if a new push lands while tests are running, kill the old test run
# and start fresh on the new commit. There's no value in finishing
# tests for code we're not going to deploy anyway.
#
# The deploy job has its own concurrency group below that DOESN'T
# cancel in-progress runs — killing a deploy mid-migration is much
# worse than queueing the new one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, openssl, curl, fileinfo, json, gd
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        # The cache key is keyed on composer.lock so cache invalidates
        # when dependencies change. Keeps repeat CI runs fast.
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: apps/api
        # --no-interaction prevents prompts; --prefer-dist skips slow
        # git clones; --no-progress keeps logs clean.
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json
        working-directory: apps/api
        run: composer validate --strict

      - name: Lint (PSR-12)
        working-directory: apps/api
        # PHPCS exits non-zero on style violations. Soft-fail for now
        # (warning-level) until the codebase has more code to enforce
        # against; flip to hard-fail when M1 lands meaningful files.
        run: composer lint || echo "::warning::PSR-12 violations found (non-blocking until M1)"

      - name: Static analysis (PHPStan)
        working-directory: apps/api
        # Same: warn-only at level 6 until codebase warrants strict.
        run: composer stan || echo "::warning::PHPStan issues found (non-blocking until M1)"

      - name: Run tests
        working-directory: apps/api
        # PHPUnit MUST pass. The HealthTest is the smoke that confirms
        # the app boots — if it ever fails, nothing else can work.
        run: composer test

  # ---------------------------------------------------------------------------
  # Deploy job — SSH to aaPanel/Apache server
  # ---------------------------------------------------------------------------
  #
  # Triggers on every push to main if the test job passed AND the
  # ENABLE_AUTO_DEPLOY repo variable is set to 'true'.
  #
  # Mechanism: SSH to the deploy host using a dedicated SSH key, run
  # /usr/local/bin/3bayti-deploy.sh which pulls the latest main, runs
  # composer install + bin/migrate.php, and updates APP_VERSION in .env.
  #
  # The SSH key on the box is restricted via authorized_keys
  # `command=/usr/local/bin/3bayti-deploy.sh` so even if the SSH
  # private key leaks, attackers can only trigger a deploy — they can't
  # get an interactive shell or run other commands.
  #
  # First-time setup (per docs/deploy/m1.5-runbook-aapanel.md):
  #   1. Generate a deploy keypair on the server:
  #        ssh-keygen -t ed25519 -f /root/.ssh/3bayti_gha_deploy -N ""
  #   2. Add the public key to /root/.ssh/authorized_keys with command
  #      restriction:
  #        command="/usr/local/bin/3bayti-deploy.sh",no-port-forwarding,...
  #          ssh-ed25519 AAAA... github-actions-deploy@3bayti
  #   3. Create /usr/local/bin/3bayti-deploy.sh (see runbook).
  #   4. In repo Settings → Secrets and variables → Actions:
  #      - Add `DEPLOY_HOST`   = server IP (e.g. 142.93.172.195)
  #      - Add `DEPLOY_USER`   = root
  #      - Add `DEPLOY_SSH_KEY` = the private key from step 1
  #        (paste the FULL contents of /root/.ssh/3bayti_gha_deploy
  #        including BEGIN/END lines)
  #   5. In repo Settings → Secrets and variables → Actions → Variables:
  #      - Add `ENABLE_AUTO_DEPLOY` = `true`
  #   6. Optionally also add `API_SMOKE_URL` = https://api-v3.3bayti.ae
  #      so the smoke test runs after deploy. If unset, smoke is skipped.
  #
  # If ENABLE_AUTO_DEPLOY is not set, this job skips silently.
  # ---------------------------------------------------------------------------

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # M1.6.3.B — deploy-specific concurrency.
    #
    # The workflow-level concurrency (top of file) cancels in-progress
    # test runs when a new push lands. We DO NOT want that for deploys:
    # killing a deploy mid-migration could leave the DB in a half-
    # applied state.
    #
    # This group queues new deploys instead of cancelling running ones.
    # If two pushes hit close together, the second deploy waits for the
    # first to finish (succeed or fail) before starting.
    #
    # Note: the workflow-level concurrency above will still cancel the
    # test job for the FIRST push when the SECOND push lands. So in
    # practice, the second push:
    #   1. Cancels the first push's test job
    #   2. Runs its own test job
    #   3. Queues behind any first-push deploy that already started
    # which is the right behaviour — we don't waste time finishing
    # tests we won't ship, but we do let in-flight deploys finish.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_AUTO_DEPLOY == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow clone is enough — we just need to know the commit SHA
          # for logging purposes.
          fetch-depth: 1

      - name: Setup SSH agent with deploy key
        # webfactory/ssh-agent loads the private key into a real ssh-agent
        # for the duration of the job. The key is only in memory; never
        # written to disk on the runner.
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust the deploy host
        # Pre-add the host's public SSH key to known_hosts so we don't
        # get a "host authenticity can't be established" prompt mid-run.
        # Using ssh-keyscan over our known DEPLOY_HOST is the standard
        # GitHub Actions pattern. The key isn't pinned here — we trust
        # it on first contact, which is acceptable for outbound SSH from
        # an ephemeral runner. To pin: replace this step with a hard-coded
        # known_hosts entry from `ssh-keyscan` output saved as a secret.
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Trigger deploy
        # SSH to the box and run the deploy command. Because the SSH key
        # has a `command=` restriction in authorized_keys, the actual
        # command we send here is IGNORED — the server runs
        # /usr/local/bin/3bayti-deploy.sh regardless of what we ask for.
        # We send 'true' as a no-op in case the restriction is ever
        # relaxed; that prevents accidentally running interactive commands.
        run: |
          ssh \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            true

      - name: Smoke test the deployment
        # If API_SMOKE_URL is set, run smoke.sh against it. This catches
        # cases where the deploy ran but the app is broken (e.g.,
        # migration succeeded but a config change broke routing).
        # If API_SMOKE_URL is NOT set, skip — deploy is reported success
        # based purely on the SSH command's exit code.
        #
        # NOTE: GitHub Actions doesn't allow `secrets.*` references in
        # `if:` conditionals. We route the secret through env first,
        # then check env. An unset secret resolves to '' in env, so
        # `if: env.API_SMOKE_URL != ''` correctly skips the step.
        env:
          API_SMOKE_URL: ${{ secrets.API_SMOKE_URL }}
        if: env.API_SMOKE_URL != ''
        run: |
          chmod +x apps/api/scripts/smoke.sh
          apps/api/scripts/smoke.sh "$API_SMOKE_URL"

      - name: Notify on failure
        if: failure()
        # No PagerDuty/Slack integration yet; failure shows as a red X
        # in the GitHub Actions UI. Future M1.6 hardening: send a
        # Slack/email notification on failure.
        run: |
          echo "::error::Deploy or smoke test failed."
          echo "::error::SSH to the box and check /var/log/3bayti-deploy.log"
          echo "::error::Recovery: see docs/deploy/m1.5-runbook-aapanel.md"
