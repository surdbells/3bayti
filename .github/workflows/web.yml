name: Web — build & deploy

# Build the apps/web storefront and deploy it to Cloudflare Pages on every
# push to main. Pull requests run the build + verify gates only (no deploy).
#
# Architecture (CSR-on-Pages)
# ---------------------------
# apps/web is a pure client-side-rendered Angular SPA served as static assets
# from Cloudflare Pages. wrangler.jsonc declares:
#   name:                   3bayti-web
#   pages_build_output_dir: ./dist/3bayti-web/browser
# The only server-side piece is the auth-proxy Pages Function
# (apps/web/functions/**), which wrangler compiles and ships alongside the
# assets.
#
# Deploy uses `wrangler pages deploy` (NOT `wrangler deploy`, which targets
# Workers). With `pages_build_output_dir` set in wrangler.jsonc, the command
# needs no positional directory — it reads the project name + output dir from
# config and auto-detects the functions/ directory. `--branch=main` forces a
# production deployment (CI checks out a detached HEAD, so wrangler cannot
# infer the branch on its own).
#
# Required GitHub repository secrets
# ----------------------------------
#   CLOUDFLARE_API_TOKEN   — API token with the "Cloudflare Pages: Edit"
#                            permission on this account.
#   CLOUDFLARE_ACCOUNT_ID  — the account id from the Cloudflare dashboard
#                            sidebar (Workers & Pages → Account details).
#
# Set them under: repo → Settings → Secrets and variables → Actions.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/design-tokens/**'
      - 'packages/api-client/**'
      - 'packages/api-contracts/**'
      - 'packages/shared-ui/**'
      - 'packages/tsconfig-3bayti/**'
      - 'packages/eslint-config-3bayti/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/design-tokens/**'
      - 'packages/api-client/**'
      - 'packages/api-contracts/**'
      - 'packages/shared-ui/**'
      - 'packages/tsconfig-3bayti/**'
      - 'packages/eslint-config-3bayti/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/web.yml'

# Cancel in-progress runs when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        # --frozen-lockfile fails if pnpm-lock.yaml is out of sync (the pnpm
        # equivalent of `npm ci`). Right call for CI reproducibility.
        run: pnpm install --frozen-lockfile

      - name: Type-check
        # Cheap fast-fail: catches TS/template regressions before the more
        # expensive Angular production build.
        run: pnpm --filter @3bayti/web type-check

      - name: Build production bundle
        # `pnpm build` runs the full npm lifecycle: prebuild (inject env) →
        # ng build → postbuild (generate sitemap.xml + robots.txt).
        run: pnpm --filter @3bayti/web build

      - name: Verify build output
        # CSR sanity check — confirms Pages will serve a real SPA shell and
        # SEO artifacts, not an empty/half-built directory. This is a pure
        # client-rendered build, so index.html is the app shell (no
        # prerendered page copy to assert on).
        working-directory: apps/web
        run: |
          set -e
          DIR=dist/3bayti-web/browser
          INDEX=$DIR/index.html
          [ -f "$INDEX" ] || { echo "ERROR: $INDEX missing"; exit 1; }
          grep -q '<app-root' "$INDEX" || { echo "ERROR: <app-root> missing from index.html"; exit 1; }
          ls "$DIR"/main-*.js >/dev/null 2>&1 || { echo "ERROR: main-*.js bundle missing"; exit 1; }
          [ -f "$DIR/sitemap.xml" ] || { echo "ERROR: sitemap.xml missing (postbuild hook)"; exit 1; }
          [ -f "$DIR/robots.txt" ]  || { echo "ERROR: robots.txt missing (postbuild hook)"; exit 1; }
          echo "✓ CSR build output verified ($(wc -c < "$INDEX") bytes index.html, sitemap + robots present)"

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/web
        run: |
          set -eo pipefail
          # Config-driven deploy: name + output dir come from wrangler.jsonc,
          # and functions/ is compiled automatically. Capture the output so we
          # can surface the deployment URL to the smoke-test step.
          DEPLOY_OUTPUT=$(pnpm exec wrangler pages deploy --branch=main 2>&1 | tee /dev/stderr)
          # wrangler prints e.g. "…over at https://<hash>.3bayti-web.pages.dev"
          # and a branch alias "https://main.3bayti-web.pages.dev".
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" \
            | grep -oE 'https://[a-z0-9-]+\.3bayti-web\.pages\.dev' | head -1)
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" \
              | grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' | head -1)
          fi
          echo "deployment-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: ${DEPLOY_URL:-<url not parsed>}"

      - name: Smoke-test the deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -e
          if [ -z "$DEPLOY_URL" ]; then
            echo "WARNING: no deployment URL parsed from wrangler output; skipping smoke test."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$DEPLOY_URL/")
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: $DEPLOY_URL/ returned HTTP $STATUS"
            exit 1
          fi
          BODY=$(curl -fsS --max-time 30 "$DEPLOY_URL/")
          if ! echo "$BODY" | grep -q '<app-root'; then
            echo "ERROR: home page did not serve the SPA shell (<app-root> missing)"
            exit 1
          fi
          echo "✓ Smoke test passed: $DEPLOY_URL/ → 200, SPA shell served."
