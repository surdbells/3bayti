<ion-header class="m7-header-shadow ion-no-border">
  <ion-toolbar class="m7-toolbar ion-no-border">
    <ion-buttons slot="start">
      <ion-button class="m7-header-back" (click)="goBack()" aria-label="Back">
        <ax-icon name="arrow-left" slot="icon-only"></ax-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="m7-title">
      <div class="chat-head">
        <span class="chat-head-name">{{ conversation?.counterparty?.name || ('text_chat' | translate) }}</span>
        <span class="chat-head-sub" *ngIf="conversation as c">{{ c.order_reference }}<ng-container *ngIf="c.item.name"> · {{ c.item.name }}</ng-container></span>
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-content" [scrollEvents]="false">
  <!-- Loading -->
  <div *ngIf="isLoading" class="loading-messages">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <!-- Messages -->
  <div *ngIf="!isLoading" class="messages-container">
    <ng-container *ngFor="let m of messages; let i = index; trackBy: trackByMessage">
      <div *ngIf="shouldShowDateSeparator(m, i)" class="date-separator">
        <span>{{ formatDateSeparator(m.created_at) }}</span>
      </div>

      <!-- System (order details / notices) -->
      <div *ngIf="isSystem(m)" class="system-row">
        <pre class="system-text">{{ m.content }}</pre>
      </div>

      <!-- Party message -->
      <div *ngIf="!isSystem(m)" class="message-wrapper" [class.own]="isOwnMessage(m)">
        <div class="message-bubble" [class.own]="isOwnMessage(m)" [class.blocked]="isBlocked(m)">
          <div class="message-text">{{ m.content }}</div>
          <div class="message-meta">
            <span *ngIf="isBlocked(m)" class="message-blocked">
              <ax-icon name="alert-circle"></ax-icon> {{ 'text_not_delivered' | translate }}
            </span>
            <span class="message-time">{{ formatTime(m.created_at) }}</span>
            <span *ngIf="m.status === 'sending'" class="message-status">
              <ion-spinner name="dots"></ion-spinner>
            </span>
          </div>
        </div>
      </div>
    </ng-container>
  </div>
</ion-content>

<ion-footer class="chat-footer ion-no-border">
  <div *ngIf="!canSend" class="disabled-notice">{{ 'text_chat_closed' | translate }}</div>
  <div class="input-container" *ngIf="canSend">
    <textarea
      #messageInput
      class="chat-input"
      [(ngModel)]="messageText"
      (input)="autoGrow()"
      (keydown)="onKeyDown($event)"
      [placeholder]="'text_type_message' | translate"
      rows="1"
      [disabled]="isSending"></textarea>
    <button
      type="button"
      class="send-btn"
      (click)="sendMessage()"
      [disabled]="!messageText.trim() || isSending"
      aria-label="Send">
      <ax-icon name="send" *ngIf="!isSending"></ax-icon>
      <ion-spinner name="crescent" *ngIf="isSending"></ion-spinner>
    </button>
  </div>
</ion-footer>
