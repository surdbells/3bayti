<ion-header class="ion-no-border">
  <ion-toolbar class="cv-toolbar ion-no-border">
    <ion-buttons slot="start">
      <ion-button class="cv-back" (click)="goBack()" aria-label="Back">
        <ax-icon name="arrow-left" slot="icon-only"></ax-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="cv-title">{{ 'text_customer_messages' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="cv-content">
  <ion-refresher slot="fixed" (ionRefresh)="load($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- First load: skeleton rows built from the real row classes. On a return
       visit the inbox refreshes in place (the loaded list stays on screen),
       instead of blanking to a spinner every time. -->
  <ul *ngIf="isLoading && conversations.length === 0" class="cv-list" role="status" aria-busy="true" [attr.aria-label]="'messages_loading' | translate">
    <li *ngFor="let s of skeletonRows" aria-hidden="true">
      <div class="cv-item cv-item--skeleton">
        <ax-skeleton-circle [size]="42" />
        <div class="cv-body">
          <div class="cv-top">
            <span class="cv-name"><ax-skeleton-line width="120px" [height]="12" /></span>
            <span class="cv-time"><ax-skeleton-line width="32px" [height]="9" /></span>
          </div>
          <div class="cv-meta"><ax-skeleton-line width="45%" [height]="9" /></div>
          <div class="cv-preview"><ax-skeleton-line width="75%" [height]="10" /></div>
        </div>
      </div>
    </li>
  </ul>

  <div *ngIf="!isLoading && conversations.length === 0" class="cv-empty">
    <ax-icon name="chatbubbles-outline"></ax-icon>
    <p>{{ 'text_no_conversations' | translate }}</p>
  </div>

  <ul *ngIf="conversations.length > 0" class="cv-list">
    <li *ngFor="let c of conversations; trackBy: trackByUuid">
      <button type="button" class="cv-item" (click)="openConversation(c)">
        <div class="cv-avatar">{{ (c.counterparty.name || '?').charAt(0) }}</div>
        <div class="cv-body">
          <div class="cv-top">
            <span class="cv-name">{{ c.counterparty.name || ('text_customer' | translate) }}</span>
            <span class="cv-time">{{ formatTime(c.last_message_at) }}</span>
          </div>
          <div class="cv-meta">{{ c.order_reference }}<ng-container *ngIf="c.item.name"> · {{ c.item.name }}</ng-container></div>
          <div class="cv-preview">{{ c.preview || ('text_no_messages_yet' | translate) }}</div>
        </div>
        <span *ngIf="c.unread_count > 0" class="cv-badge">{{ c.unread_count }}</span>
      </button>
    </li>
  </ul>
</ion-content>
