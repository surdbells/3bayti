<ion-header class="ion-no-border">
  <ion-toolbar class="cv-toolbar ion-no-border">
    <ion-buttons slot="start">
      <ion-button class="cv-back" (click)="goBack()" aria-label="Back">
        <ax-icon name="arrow-left" slot="icon-only"></ax-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="cv-title">{{ 'text_messages' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="cv-content">
  <ion-refresher slot="fixed" (ionRefresh)="load($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div *ngIf="isLoading" class="cv-loading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div *ngIf="!isLoading && conversations.length === 0" class="cv-empty">
    <ax-icon name="chatbubbles-outline"></ax-icon>
    <p>{{ 'text_no_conversations' | translate }}</p>
  </div>

  <ul *ngIf="!isLoading && conversations.length > 0" class="cv-list">
    <li *ngFor="let c of conversations; trackBy: trackByUuid">
      <button type="button" class="cv-item" (click)="openConversation(c)">
        <div class="cv-avatar">{{ (c.counterparty.name || '?').charAt(0) }}</div>
        <div class="cv-body">
          <div class="cv-top">
            <span class="cv-name">{{ c.counterparty.name || ('text_vendor' | translate) }}</span>
            <span class="cv-time">{{ formatTime(c.last_message_at) }}</span>
          </div>
          <div class="cv-meta">{{ c.order_reference }}<ng-container *ngIf="c.item.name"> · {{ c.item.name }}</ng-container></div>
          <div class="cv-preview">{{ c.preview || ('text_no_messages_yet' | translate) }}</div>
        </div>
        <span *ngIf="c.unread_count > 0" class="cv-badge">{{ c.unread_count }}</span>
      </button>
    </li>
  </ul>
</ion-content>
