<ion-header class="m7-header-shadow ion-no-border">
  <ion-toolbar class="m7-toolbar ion-no-border">
    <ion-buttons slot="start">
      <ion-button [routerLink]="['/ticketlist']" class="m7-header-back" aria-label="Back">
        <ax-icon name="arrow-left" />
      </ion-button>
    </ion-buttons>
    <ion-title class="m7-title">{{ 'title_create_ticket' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="page-bg">
  <!-- The form stays mounted at all times. Earlier this whole block was
       gated behind @if (!ui_controls.is_loading), so toggling is_loading
       (true while get_vendors() runs, back to false on the HTTP response)
       DESTROYED and RECREATED the ax-text-field / ion-button subtree from
       inside an async subscribe callback. The recreated OnPush children
       rendered with empty projected content (invisible labels, inputs and
       button text). The working pages (login / register / profile) never
       unmount their inputs on load — they overlay the loader instead. We
       do the same here: render the form always, show the loader as an
       overlay, and disable the submit button while loading. -->
  <div class="form-sheet ion-padding" [class.is-busy]="ui_controls.is_loading">

      <!-- Subject -->
      <div class="form-field">
        <ax-text-field
          [label]="'placeholder_short_subject' | translate"
          [placeholder]="'placeholder_short_subject' | translate"
          [(ngModel)]="create.subject"
          [maxlength]="60"
          name="subject">
        </ax-text-field>
      </div>

      <!-- Summary (multiline) -->
      <div class="form-field">
        <ax-text-field
          [label]="'label_summary' | translate"
          [placeholder]="'placeholder_describe_issue' | translate"
          [(ngModel)]="create.message"
          [multiline]="true"
          [rows]="4"
          [maxlength]="160"
          name="summary">
        </ax-text-field>
      </div>

      <!-- Reference (store selector) -->
      <div class="form-field">
        <label class="form-field__label">{{ 'label_reference_optional' | translate }}</label>
        <ion-select
          [(ngModel)]="create.store"
          interface="action-sheet"
          class="form-select"
          [placeholder]="'option_general_support' | translate"
          [interfaceOptions]="{ cssClass: 'ax-action-sheet' }">
          <ion-select-option [value]="0">{{ 'option_general_support' | translate }}</ion-select-option>
          @for(t of stores; track t.store){
            <ion-select-option [value]="t.store">{{ t.store_name }}</ion-select-option>
          }
        </ion-select>
      </div>

      <!-- Submit -->
      <ion-button
        (click)="create_ticket()"
        expand="block"
        class="submit-btn"
        type="button"
        [disabled]="ui_controls.is_loading">
        {{ 'button_create_ticket' | translate }}
      </ion-button>
  </div>

  <!-- Loader overlay — sits on top of the (always-mounted) form while
       vendors load or the ticket is being submitted. -->
  @if (ui_controls.is_loading) {
    <div class="loader-overlay">
      <ax-loader></ax-loader>
    </div>
  }
</ion-content>

<app-tab-bar></app-tab-bar>
