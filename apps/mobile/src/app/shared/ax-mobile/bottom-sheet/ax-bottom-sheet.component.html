<ng-template #sheetTemplate>
  <div
    class="ax-sheet"
    [class.ax-sheet--inset]="inset"
    [class.ax-sheet--fullscreen]="!inset"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="title ? sheetId + '-title' : null"
    [attr.aria-label]="!title ? ariaLabel : null"
    [style.height]="sheetHeightVh + 'vh'"
    [style.transform]="'translate3d(0, ' + dragOffsetPx + 'px, 0)'"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)">

    <!-- Drag zone: handle + header are draggable; body is not -->
    <div class="ax-sheet__drag-zone">
      @if (showHandle) {
        <div class="ax-sheet__handle" aria-hidden="true"></div>
      }

      <!-- Custom slotted header (preferred when set) -->
      <ng-content select="[ax-sheet-header]"></ng-content>

      <!-- OR inline title row (when no slotted header) -->
      @if (title) {
        <div class="ax-sheet__title-row">
          <h2 class="ax-sheet__title" [id]="sheetId + '-title'">{{ title }}</h2>
          @if (showCloseButton !== false) {
            <button
              type="button"
              class="ax-sheet__close"
              (click)="onCloseClick()"
              aria-label="Close">
              <ax-icon name="x" />
            </button>
          }
        </div>
      }
    </div>

    <!-- Built-in NATIVE search input (never ion-searchbar/ion-select: see
         the component docstring re: the CDK-overlay z-index trap). -->
    @if (searchable) {
      <div class="ax-sheet__search">
        <ax-icon name="search" class="ax-sheet__search-icon" aria-hidden="true" />
        <input
          #searchInput
          class="ax-sheet__search-input"
          type="text"
          inputmode="search"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          [attr.placeholder]="searchPlaceholder"
          [attr.aria-label]="searchPlaceholder || 'Search'"
          [value]="searchQuery"
          (input)="onSearchInput($event)" />
        @if (searchQuery) {
          <button
            type="button"
            class="ax-sheet__search-clear"
            (click)="clearSearch(); searchInput.focus()"
            aria-label="Clear search">
            <ax-icon name="x" />
          </button>
        }
      </div>
    }

    <!-- Body content -->
    <div class="ax-sheet__body">
      <ng-content></ng-content>
    </div>

    <!-- Optional sticky footer -->
    <ng-content select="[ax-sheet-footer]"></ng-content>
  </div>
</ng-template>
