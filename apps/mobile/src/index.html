<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>3bayti</title>
  <base href="/" />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poltawski+Nowy:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poltawski+Nowy:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="preload" as="image" href="/assets/images/logo.png">
  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <!-- Pre-bootstrap background: matches --ax-color-bg-canvas (#faf8f5).
       Applied inline so the WebView shows brand canvas the moment it
       mounts, eliminating the white flash between native splash dismissal
       and Angular bootstrap. Update if --ax-palette-neutral-50 changes. -->
  <style>html,body{background:#faf8f5;margin:0}</style>
  <!-- Respect the device's light/dark appearance deterministically: set
       data-ax-theme from the OS colour scheme BEFORE paint (the ax token system
       keys dark mode off [data-ax-theme]). Avoids relying on the CSS media
       query alone (which the iOS WKWebView can evaluate inconsistently) and
       tracks live OS toggles. -->
  <script>
    (function () {
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var set = function (dark) {
          document.documentElement.setAttribute('data-ax-theme', dark ? 'dark' : 'light');
        };
        set(mq.matches);
        if (mq.addEventListener) { mq.addEventListener('change', function (e) { set(e.matches); }); }
        else if (mq.addListener) { mq.addListener(function (e) { set(e.matches); }); }
      } catch (e) { /* fall back to default styling */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
