; PHP-FPM production pool configuration.
;
; This file replaces the default www.conf shipped with php-fpm.
; Changes from default:
;   - Listens on a Unix socket (faster than TCP for nginx <-> FPM)
;   - Logs to stderr (so docker logs / App Platform sees them)
;   - Tuned worker counts for typical web-API workload
;   - Captures worker output (so PHP errors appear in container logs)
;   - Health-check ping endpoint for FPM itself

[www]

; -----------------------------------------------------------------------------
; Process owner
; -----------------------------------------------------------------------------
user = www-data
group = www-data

; -----------------------------------------------------------------------------
; Listening address
; -----------------------------------------------------------------------------
; Unix socket — faster than TCP for nginx <-> FPM on the same host.
; The socket file's permissions must let nginx read+write; we set
; that via listen.owner / listen.group.
listen = /var/run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; -----------------------------------------------------------------------------
; Process manager
; -----------------------------------------------------------------------------
; "dynamic" — FPM keeps a pool of idle workers and spawns more on
; demand up to max_children. This is the right shape for typical
; web traffic (bursty arrival, mostly-idle workers between bursts).
;
; pm.max_children: the cap. Each worker holds ~30 MB resident; with
;   a 1 GB container we can comfortably run 20 workers (600 MB) and
;   leave room for opcache + nginx + filesystem cache.
;
; pm.start_servers: how many workers to spawn at boot. ~25% of max
;   means traffic doesn't hit cold-start on the first few requests.
;
; pm.min/max_spare_servers: keep at least 2, at most 6 idle workers.
;   Below 2 means new requests wait; above 6 wastes memory.
;
; pm.max_requests: recycle each worker after 1000 requests. Guards
;   against memory leaks accumulating over a worker's lifetime.
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; -----------------------------------------------------------------------------
; Logging
; -----------------------------------------------------------------------------
; Output goes to stderr — supervisord forwards it to docker stdout,
; which App Platform captures. Without this, FPM logs disappear into
; the container.
catch_workers_output = yes
decorate_workers_output = no

; FPM's own access log (per-request). Disabled — nginx already logs
; access lines, and duplicating just makes log volume worse.
access.log = /dev/null

; -----------------------------------------------------------------------------
; FPM ping (for FPM-internal health, distinct from /v3/health which
; is the API's own endpoint). Useful for debugging "is FPM alive?"
; without bothering with the full request stack.
; -----------------------------------------------------------------------------
ping.path = /fpm-ping
ping.response = pong

; -----------------------------------------------------------------------------
; Slow-log — record requests that exceed N seconds with a stack trace.
; Helps diagnose hung queries / runaway loops in production. 5s is
; well above any legitimate auth request time.
; -----------------------------------------------------------------------------
slowlog = /dev/stderr
request_slowlog_timeout = 5s

; Clear environment so workers don't inherit shell variables. We
; explicitly forward only what we need.
clear_env = no
