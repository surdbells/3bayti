; Production PHP configuration overrides.
;
; Loaded after php.ini (default values) — the zz- prefix on the file
; name ensures it loads last so these settings win.

; -----------------------------------------------------------------------------
; Error reporting — log everything, display nothing
; -----------------------------------------------------------------------------
; Display errors in HTML responses leaks internals (paths, SQL, etc).
; We log to stderr, which the container orchestrator (App Platform)
; aggregates into its log stream. Our ApiErrorMiddleware catches
; any unhandled exception and returns a clean JSON error envelope.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL
log_errors_max_len = 0

; -----------------------------------------------------------------------------
; Memory + execution limits
; -----------------------------------------------------------------------------
; 256M is generous for our workload (no big file processing). Doctrine
; with eager loading on a 100-row result set runs comfortably under 50M.
; The headroom is for safety — Postgres queries that fetch a lot more
; than expected won't OOM the worker.
memory_limit = 256M

; 30s is plenty for any reasonable request. Anything longer should be
; an async job (M3+ adds a queue worker). Setting this prevents a
; runaway query from holding a worker forever.
max_execution_time = 30
max_input_time = 30

; Body size — auth bodies are tiny (<1 KB); product images go to R2
; via signed URLs (M2), not through the API. 8M is generous.
post_max_size = 8M
upload_max_filesize = 8M

; -----------------------------------------------------------------------------
; OPcache — production must-have, ~3-5x throughput improvement
; -----------------------------------------------------------------------------
; OPcache compiles PHP scripts to bytecode and caches them in shared
; memory. Without it, every request re-compiles every loaded file.
;
; The validate_timestamps=0 + revalidate_freq=0 combo means OPcache
; NEVER checks if files changed. That's safe in production because
; we never change files at runtime (a deploy creates a new container).
; But we MUST clear the cache on deploy. Containers do this for free —
; new container = fresh cache.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.fast_shutdown = 1

; OPcache file cache — second-tier persistent cache. Helps on cold-start
; (new container) by reading bytecode from disk instead of re-compiling.
opcache.file_cache = /tmp/opcache
opcache.file_cache_only = 0

; Pre-load entire app — speeds up first request. Skipped in M1.5;
; needs careful curation. Revisit in M5 hardening if needed.
; opcache.preload = /var/www/html/public/preload.php
; opcache.preload_user = www-data

; -----------------------------------------------------------------------------
; Session + crypto
; -----------------------------------------------------------------------------
; We use stateless JWT auth, not PHP sessions. But some frameworks
; (and some packages we don't use) initialize the session subsystem;
; better to set sane defaults than rely on `session.save_path = /tmp`.
session.use_strict_mode = 1
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = "Strict"

; -----------------------------------------------------------------------------
; Misc
; -----------------------------------------------------------------------------
; Date — UTC for everything. Timestamp formatting in responses uses
; UTC explicitly via format(\DateTimeInterface::ATOM); this default
; just affects edge cases like log timestamps.
date.timezone = "UTC"

; expose_php — the X-Powered-By header reveals the PHP version. No
; reason to leak that to clients.
expose_php = Off

; realpath_cache — bigger means fewer disk lookups for require()s.
; 4M is safe for our codebase size.
realpath_cache_size = 4M
realpath_cache_ttl = 600
