# supervisord — process manager that runs nginx + php-fpm side-by-side
# in the single container.
#
# Why supervisord? Containers want a single PID 1; running both nginx
# and php-fpm directly means whichever you start in CMD becomes PID 1
# and the other dies orphaned. supervisord becomes PID 1 and manages
# both as children, restarting either if it crashes.
#
# Logs from both processes are forwarded to supervisord's stdout/stderr,
# which become the container's stdout/stderr, which App Platform
# captures and surfaces in its dashboard.

[supervisord]
# Run in foreground (no daemon mode) — supervisord IS the container's
# main process, can't background itself.
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

# Don't auto-shut down if a process exits. supervisord's default is
# "if all processes are dead, exit". We want individual restarts.
loglevel=info

# -----------------------------------------------------------------------------
# php-fpm
# -----------------------------------------------------------------------------
[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
# Forward FPM logs to supervisord's stdout (and thus container stdout).
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Stop signal — FPM responds to SIGQUIT for graceful shutdown
# (let in-flight requests finish before exiting). Default SIGTERM
# would kill them mid-flight.
stopsignal=QUIT
stopwaitsecs=10

# -----------------------------------------------------------------------------
# nginx
# -----------------------------------------------------------------------------
[program:nginx]
# nginx.conf has daemon=off so this runs in foreground.
command=/usr/sbin/nginx
autostart=true
autorestart=true
priority=10
# nginx starts AFTER php-fpm so the FPM socket exists before
# nginx tries to connect. Delay 2s for safety.
startsecs=2
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT
stopwaitsecs=10
