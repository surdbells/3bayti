# Main nginx config — global settings.
# Per-server settings live in /etc/nginx/http.d/default.conf.

user www-data;
worker_processes auto;

# Run nginx in foreground (NOT as daemon) so supervisord can manage it.
# Without this, supervisord would think nginx exited immediately.
daemon off;

# Where to log nginx-internal errors. /dev/stderr is captured by
# supervisord and forwarded to container stdout.
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # Default MIME types — needed for the few static files we might
    # serve (none yet; reserved for OpenAPI spec output later).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Access log → stdout. Each line is a request. App Platform
    # ingests this for monitoring + alerting.
    log_format combined_with_timing
        '$remote_addr - $remote_user [$time_iso8601] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time uct="$upstream_connect_time" '
        'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /dev/stdout combined_with_timing;

    # Performance — sendfile + tcp_nopush is the standard combo for
    # serving cached/static content faster.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keep-alive — re-use connections from clients (saves TLS handshake
    # cost). 65s is just under most reverse-proxy timeouts.
    keepalive_timeout 65;
    keepalive_requests 100;

    # Compress JSON responses — auth responses include the full user
    # object which can be 1 KB+. gzip cuts that ~70% in transit.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml;

    # Hide nginx version from response headers — same reasoning as
    # PHP's expose_php=Off. Don't tell attackers what version we run.
    server_tokens off;

    # Rate-limit zone — primary rate limiting lives at MessageCentral
    # (OTP) or Redis-backed in M1.5b. This is a safety net at the
    # edge: cap any single IP at 30 requests/sec across ALL endpoints.
    # Generous enough that legitimate users are unaffected; aggressive
    # enough to slow down naive attackers.
    limit_req_zone $binary_remote_addr zone=ratelimit:10m rate=30r/s;
    limit_req_status 429;

    # Real client IP — when running behind a load balancer (App
    # Platform's edge), the original client IP is in X-Forwarded-For.
    # nginx replaces $remote_addr with that value when set_real_ip_from
    # matches the upstream. App Platform's internal LB sits in
    # 10.244.0.0/16 (private cluster network).
    set_real_ip_from 10.244.0.0/16;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Per-server config.
    include /etc/nginx/http.d/*.conf;
}
