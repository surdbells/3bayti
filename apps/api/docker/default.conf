# Default server block — handles all requests on $PORT.
#
# The PORT env var is set by DigitalOcean App Platform (typically 8080).
# entrypoint.sh substitutes it into this file at container start; we
# use a placeholder ${PORT} here that's resolved at runtime.

server {
    # Listen on whatever port the platform assigned. Default 8080.
    listen ${PORT} default_server;
    listen [::]:${PORT} default_server;

    server_name _;
    root /var/www/html/public;
    index index.php;

    # Apply the global rate limit zone defined in nginx.conf.
    # burst=15 lets short spikes through; nodelay means we don't
    # queue them (just reject above limit). Better to fail fast.
    limit_req zone=ratelimit burst=15 nodelay;

    # FPM's internal ping (debug only — useful for "is FPM alive?"
    # without going through the full Slim stack).
    location = /fpm-ping {
        access_log off;
        allow 127.0.0.1;
        deny all;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Health checks bypass rate-limiting (otherwise an aggressive
    # health-checker triggers 429 and looks like an outage).
    # /v3/health and /v3/health/ready both hit this.
    location ~ ^/v3/health(/ready)?$ {
        limit_req off;
        access_log off;  # don't pollute access log with health probes
        try_files $uri /index.php?$query_string;
    }

    # Main entry point — everything else routes through index.php
    # which boots the Slim app.
    location / {
        try_files $uri /index.php?$query_string;
    }

    # PHP handler.
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Buffer/timeout — these are FPM's defaults but pinned for
        # explicitness. Long-running requests (>30s) shouldn't exist;
        # max_execution_time in php.ini already caps PHP-side.
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Forward client info (relied on by RequestContext::extractIp).
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    }

    # Block access to sensitive files. .env is in .dockerignore so it
    # shouldn't be in the container at all, but defense in depth.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to vendor/ and tests/ directly via URL (they're
    # under document root so technically reachable — refuse).
    location ~ ^/(vendor|tests|migrations|config)/ {
        deny all;
    }
}
