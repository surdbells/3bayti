<main class="not-found-page">
  <ui-container size="narrow">
    <ui-stack gap="lg" align="center">
      <p class="not-found-page__code" aria-hidden="true">404</p>

      <ui-stack gap="md" align="center">
        <p class="eyebrow">{{ 'notFound.eyebrow' | translate }}</p>
        <ui-heading level="h1" size="xl">{{ 'notFound.title' | translate }}</ui-heading>
        <ui-text size="lg" tone="secondary">{{ 'notFound.body' | translate }}</ui-text>
      </ui-stack>

      <ui-stack
        class="not-found-page__actions"
        direction="horizontal"
        gap="sm"
        justify="center"
        [wrap]="true">
        <ui-button variant="primary" size="lg" routerLink="/">{{ 'notFound.home' | translate }}</ui-button>
        <ui-button variant="secondary" size="lg" routerLink="/category">{{ 'notFound.categories' | translate }}</ui-button>
      </ui-stack>
    </ui-stack>
  </ui-container>
</main>
