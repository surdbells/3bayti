<div class="ax-auth-shell ax-auth-shell-narrow">
  <div class="ax-auth-shell-inner">
    <div>
      <div class="ax-auth-panel">
        <div class="ax-auth-header">
          <img class="ax-auth-logo" src="assets/img/abayti.png" alt="Abayti" />
        </div>

        <div class="ax-auth-body">
          <div>
            <h1 class="ax-auth-title">Set a new password</h1>
            <p class="ax-auth-subtitle">
              Welcome to 3bayti. For your security, replace the temporary password
              from your approval email before you continue.
            </p>
          </div>

          <form (ngSubmit)="submit()" method="post" class="ax-flex ax-flex-col ax-gap-3">
            <div class="ax-form-field">
              <label for="cp-email" class="ax-label">Email</label>
              <input id="cp-email" type="email" class="ax-input" [value]="email" readonly disabled />
            </div>

            <div class="ax-form-field">
              <label for="cp-current" class="ax-label ax-label-required">Temporary password</label>
              <input
                id="cp-current"
                name="current"
                [type]="show ? 'text' : 'password'"
                class="ax-input"
                [(ngModel)]="current_password"
                autocomplete="current-password"
                placeholder="From your approval email"
                required />
            </div>

            <div class="ax-form-field">
              <label for="cp-new" class="ax-label ax-label-required">New password</label>
              <input
                id="cp-new"
                name="newpw"
                [type]="show ? 'text' : 'password'"
                class="ax-input"
                [(ngModel)]="new_password"
                autocomplete="new-password"
                placeholder="At least 8 characters"
                required />
            </div>

            <div class="ax-form-field">
              <label for="cp-confirm" class="ax-label ax-label-required">Confirm new password</label>
              <input
                id="cp-confirm"
                name="confirmpw"
                [type]="show ? 'text' : 'password'"
                class="ax-input"
                [(ngModel)]="confirm_password"
                autocomplete="new-password"
                required />
            </div>

            <label class="ax-check">
              <input type="checkbox" name="show" [(ngModel)]="show" />
              <span class="ax-check-box"></span>
              <span class="ax-check-label">Show passwords</span>
            </label>

            <button
              type="submit"
              class="ax-btn ax-btn-primary ax-btn-lg ax-mt-2"
              [disabled]="saving">
              <span *ngIf="saving" class="ax-spinner ax-spinner-sm" aria-hidden="true"></span>
              <span>{{ saving ? 'Saving…' : 'Save and continue' }}</span>
            </button>
          </form>

          <p class="ax-auth-meta">
            <button type="button" class="ax-btn-link" (click)="signOut()">Sign out</button>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
