<!-- Dual shell: vendor side nav / admin aside -->
<app-vendor-shell *ngIf="user_session.is_vendor">
  <ng-container *ngTemplateOutlet="couponsContent"></ng-container>
</app-vendor-shell>

<app-admin-shell *ngIf="user_session.is_admin">
  <ng-container *ngTemplateOutlet="couponsContent"></ng-container>
</app-admin-shell>

<ng-template #couponsContent>
  <div class="ax-container">
    <!-- Header -->
    <header class="ax-page-header">
      <div class="ax-page-header-content">
        <button
          type="button"
          (click)="goBack()"
          class="ax-btn ax-btn-ghost ax-btn-sm ax-mb-2"
          style="align-self: flex-start;">
          <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
          Back
        </button>
        <span class="ax-page-header-eyebrow">Promotions</span>
        <h1 class="ax-page-title">Coupons</h1>
        <p *ngIf="pagination.total > 0" class="ax-page-subtitle">
          {{ pagination.total }} coupon{{ pagination.total !== 1 ? 's' : '' }} on the platform.
        </p>
      </div>

      <div class="ax-flex ax-gap-2 ax-items-center">
        <button
          type="button"
          class="ax-btn ax-btn-outline ax-btn-sm"
          (click)="toggleFilters()"
          style="position: relative;">
          <span class="material-symbols-outlined" aria-hidden="true">tune</span>
          Filters
          <span *ngIf="activeFilterCount > 0" class="ax-badge ax-badge-solid-brand" style="margin-left: 0.25rem;">{{ activeFilterCount }}</span>
        </button>
        <a routerLink="/create-coupon" class="ax-btn ax-btn-primary ax-btn-sm">
          <span class="material-symbols-outlined" aria-hidden="true">add</span>
          New coupon
        </a>
      </div>
    </header>

    <!-- Search -->
    <section class="ax-page-section">
      <div class="ax-input-group">
        <span class="ax-input-group-prefix">
          <span class="material-symbols-outlined" aria-hidden="true" style="color: var(--ax-color-text-tertiary);">search</span>
        </span>
        <input
          type="text"
          class="ax-input"
          placeholder="Search by code or name…"
          name="search"
          [(ngModel)]="filters.search"
          (ngModelChange)="onSearchInput()" />
        <button
          *ngIf="filters.search"
          type="button"
          class="ax-btn ax-btn-ghost ax-input-group-action"
          (click)="filters.search = ''; onSearchInput()">
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      </div>
    </section>

    <!-- Filters panel -->
    <section *ngIf="ui.filters_open" class="ax-page-section">
      <div class="ax-card ax-p-4">
        <div class="ax-flex ax-gap-3 ax-flex-wrap ax-items-end">
          <div class="ax-form-field" style="flex: 1; min-width: 10rem;">
            <label class="ax-label ax-text-2xs" for="filter_status">Status</label>
            <select id="filter_status" class="ax-select ax-input-sm" name="filter_status" [(ngModel)]="filters.status">
              <option value="">All statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="expired">Expired</option>
            </select>
          </div>
          <div class="ax-form-field" style="flex: 1; min-width: 10rem;">
            <label class="ax-label ax-text-2xs" for="filter_type">Type</label>
            <select id="filter_type" class="ax-select ax-input-sm" name="filter_type" [(ngModel)]="filters.discount_type">
              <option value="">All types</option>
              <option value="percentage">Percentage</option>
              <option value="fixed_amount">Fixed amount</option>
              <option value="free_shipping">Free shipping</option>
            </select>
          </div>
          <button
            type="button"
            class="ax-btn ax-btn-primary ax-btn-sm"
            (click)="applyFilters()">
            <span class="material-symbols-outlined" aria-hidden="true">filter_list</span>
            Apply
          </button>
          <button
            *ngIf="hasActiveFilters"
            type="button"
            class="ax-btn ax-btn-ghost ax-btn-sm"
            (click)="clearFilters()">
            <span class="material-symbols-outlined" aria-hidden="true">filter_list_off</span>
            Clear
          </button>
        </div>
      </div>
    </section>

    <!-- Loading -->
    <div *ngIf="ui.loading || ui.deleting || ui.toggling" class="ax-flex ax-justify-center ax-py-8">
      <span class="ax-spinner ax-spinner-lg" aria-label="Loading"></span>
    </div>

    <!-- Table -->
    <!-- Coupons table -->
    <section class="ax-card ax-p-0">
      <app-ax-data-table [config]="tableConfig" [dataSource]="tableDataSource" (rowAction)="onTableRowAction($event)">
        <ng-template axCell="discount_type" let-c>
          <span [ngClass]="getDiscountTypeBadge(c.discount_type)">{{ getDiscountTypeLabel(c.discount_type) }}</span>
        </ng-template>
        <ng-template axCell="status" let-c>
          <span class="ax-badge"
            [class.ax-badge-success]="c.status === 'active'"
            [class.ax-badge-neutral]="c.status !== 'active'">
            {{ c.status | titlecase }}
          </span>
        </ng-template>
      </app-ax-data-table>
    </section>
  </div>
</ng-template>
