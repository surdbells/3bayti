<app-admin-shell>
  <div class="ax-container">
    <header class="ax-page-header">
      <div class="ax-page-header-content">
        <button type="button" (click)="goBack()" class="ax-btn ax-btn-ghost ax-btn-sm ax-mb-2" style="align-self:flex-start">
          <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span> Back to dashboard
        </button>
        <span class="ax-page-header-eyebrow">Operations</span>
        <h1 class="ax-page-title">Logistics</h1>
        <p class="ax-page-subtitle">Stores with orders awaiting delivery.</p>
      </div>
    </header>

    <section class="ax-card ax-p-0">
      <app-ax-data-table [config]="config" [dataSource]="dataSource" (rowAction)="onRowAction($event)"></app-ax-data-table>
    </section>
  </div>
</app-admin-shell>
