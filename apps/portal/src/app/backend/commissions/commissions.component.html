<app-admin-shell>
  <div class="ax-container">
    <header class="ax-page-header">
      <div class="ax-page-header-content">
        <button type="button" (click)="goBack()" class="ax-btn ax-btn-ghost ax-btn-sm ax-mb-2" style="align-self:flex-start">
          <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span> Back to dashboard
        </button>
        <span class="ax-page-header-eyebrow">Finance</span>
        <h1 class="ax-page-title">Commissions</h1>
        <p class="ax-page-subtitle">Platform commission and vendor settlement breakdown.</p>
      </div>
    </header>

    <section class="ax-card ax-p-0">
      <app-ax-data-table [config]="config" [dataSource]="dataSource">
        <ng-template axCell="status" let-row>
          <span class="ax-badge"
            [class.ax-badge-success]="row.status === 'delivered' || row.status === 'paid'"
            [class.ax-badge-info]="row.status === 'shipped'"
            [class.ax-badge-warning]="row.status === 'pending'"
            [class.ax-badge-danger]="row.status === 'cancelled' || row.status === 'returned'">
            {{ row.status | titlecase }}
          </span>
        </ng-template>
      </app-ax-data-table>
    </section>
  </div>
</app-admin-shell>
