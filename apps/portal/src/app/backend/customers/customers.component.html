<app-admin-shell>
  <div class="ax-container">
    <header class="ax-page-header">
      <div class="ax-page-header-content">
        <button type="button" (click)="goBack()" class="ax-btn ax-btn-ghost ax-btn-sm ax-mb-2" style="align-self:flex-start">
          <app-icon name="arrow_back" aria-hidden="true"></app-icon> Back to dashboard
        </button>
        <span class="ax-page-header-eyebrow">Platform</span>
        <h1 class="ax-page-title">Customers</h1>
        <p class="ax-page-subtitle">All registered customers across the platform.</p>
      </div>
    </header>

    <section class="ax-mb-4">
      <div class="ax-filter-grid">
        <label class="ax-field">
          <span class="ax-field-label">{{ 'customers.filter_status' | translate }}</span>
          <app-ax-combobox [(ngModel)]="filters.status" (selectionChange)="applyFilters()"
            [options]="statusFilterOptions" [searchable]="true" [allowClear]="false"
            [ariaLabel]="'customers.filter_status' | translate"></app-ax-combobox>
        </label>

        <label class="ax-field">
          <span class="ax-field-label">{{ 'customers.filter_email_verified' | translate }}</span>
          <app-ax-combobox [(ngModel)]="filters.email_verified" (selectionChange)="applyFilters()"
            [options]="emailVerifiedFilterOptions" [searchable]="true" [allowClear]="false"
            [ariaLabel]="'customers.filter_email_verified' | translate"></app-ax-combobox>
        </label>

        <label class="ax-field">
          <span class="ax-field-label">{{ 'customers.filter_phone_verified' | translate }}</span>
          <app-ax-combobox [(ngModel)]="filters.phone_verified" (selectionChange)="applyFilters()"
            [options]="phoneVerifiedFilterOptions" [searchable]="true" [allowClear]="false"
            [ariaLabel]="'customers.filter_phone_verified' | translate"></app-ax-combobox>
        </label>

        <label class="ax-field">
          <span class="ax-field-label">{{ 'customers.filter_registered_from' | translate }}</span>
          <input type="date" class="ax-input" [attr.placeholder]="'customers.filter_date_hint' | translate" [(ngModel)]="filters.created_from" (change)="applyFilters()" />
        </label>

        <label class="ax-field">
          <span class="ax-field-label">{{ 'customers.filter_registered_to' | translate }}</span>
          <input type="date" class="ax-input" [attr.placeholder]="'customers.filter_date_hint' | translate" [(ngModel)]="filters.created_to" (change)="applyFilters()" />
        </label>

        <label class="ax-field">
          <span class="ax-field-label">{{ 'customers.filter_min_orders' | translate }}</span>
          <input type="number" min="0" class="ax-input" [attr.placeholder]="'customers.filter_min_orders_hint' | translate" [(ngModel)]="filters.min_orders" (change)="applyFilters()" />
        </label>

        <div class="ax-field ax-filter-actions">
          <button type="button" class="ax-btn ax-btn-ghost ax-btn-sm" (click)="clearFilters()">
            <app-icon name="close" aria-hidden="true"></app-icon> {{ 'customers.filter_clear' | translate }}
          </button>
        </div>
      </div>
    </section>

    <section class="ax-card ax-p-0">
      <app-ax-data-table [config]="config" [dataSource]="dataSource" (rowAction)="onRowAction($event)">
        <ng-template axCell="name" let-row>
          <span class="ax-font-medium ax-text-primary">{{ row.first_name }} {{ row.last_name }}</span>
        </ng-template>
        <ng-template axCell="status" let-row>
          <span class="ax-badge" [class.ax-badge-success]="row.status" [class.ax-badge-danger]="!row.status">
            {{ row.status ? 'Active' : 'Inactive' }}
          </span>
        </ng-template>
      </app-ax-data-table>
    </section>
  </div>
</app-admin-shell>
