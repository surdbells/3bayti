<app-admin-shell>
  <div class="ax-container">
    <header class="ax-page-header">
      <div class="ax-page-header-content">
        <button type="button" (click)="goBack()" class="ax-btn ax-btn-ghost ax-btn-sm ax-mb-2" style="align-self:flex-start">
          <app-icon name="arrow_back" aria-hidden="true"></app-icon> Back to dashboard
        </button>
        <span class="ax-page-header-eyebrow">Catalog</span>
        <h1 class="ax-page-title">Products</h1>
        <p class="ax-page-subtitle">All products listed across vendor stores.</p>
      </div>
      <div class="ax-flex ax-gap-2 ax-items-center">
        <button type="button" class="ax-btn ax-btn-primary" (click)="newProduct()">
          <app-icon name="add" aria-hidden="true"></app-icon>
          New product
        </button>
      </div>
    </header>

    <section class="ax-card ax-p-0">
      <app-ax-data-table [config]="config" [dataSource]="dataSource" (rowAction)="onRowAction($event)">
        <ng-template axCell="store_name" let-row>
          <div>
            <div class="ax-text-sm">{{ row.first_name }} {{ row.last_name }}</div>
            <div class="ax-text-2xs ax-text-tertiary">{{ row.store_name }}</div>
          </div>
        </ng-template>
        <ng-template axCell="stock_status" let-row>
          <span [ngClass]="stockBadge(row.stock_status)">{{ stockLabel(row.stock_status) }}</span>
        </ng-template>
        <ng-template axCell="status" let-row>
          <span [ngClass]="statusBadge(row.status)">{{ row.status | titlecase }}</span>
        </ng-template>
      </app-ax-data-table>
    </section>
  </div>
</app-admin-shell>
