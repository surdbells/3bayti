<app-admin-shell>
  <div class="ax-container">
    <header class="ax-page-header">
      <div class="ax-page-header-content">
        <button type="button" (click)="goBack()" class="ax-btn ax-btn-ghost ax-btn-sm ax-mb-2" style="align-self:flex-start">
          <app-icon name="arrow_back" aria-hidden="true"></app-icon> Back to dashboard
        </button>
        <span class="ax-page-header-eyebrow">Catalog</span>
        <h1 class="ax-page-title">Collections</h1>
        <p class="ax-page-subtitle">Admin-curated groups of products shown on the storefront. Active collections appear in display order.</p>
      </div>
      <div class="ax-flex ax-gap-2 ax-items-center" *axCan="'catalog.collections_manage'">
        <a routerLink="/admin/collections/new" class="ax-btn ax-btn-primary ax-btn-sm">
          <app-icon name="add" aria-hidden="true"></app-icon> New collection
        </a>
      </div>
    </header>

    <section class="ax-card ax-p-0">
      <app-ax-data-table [config]="config" [dataSource]="dataSource" (rowAction)="onRowAction($event)">
        <ng-template axCell="is_active" let-row>
          <span class="ax-badge" [class.ax-badge-success]="row.is_active" [class.ax-badge-neutral]="!row.is_active">
            {{ row.is_active ? 'Active' : 'Inactive' }}
          </span>
        </ng-template>
      </app-ax-data-table>
    </section>
  </div>
</app-admin-shell>
