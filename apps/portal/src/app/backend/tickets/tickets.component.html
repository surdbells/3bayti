<app-admin-shell>
  <div class="ax-container">
    <header class="ax-page-header">
      <div class="ax-page-header-content">
        <button type="button" (click)="goBack()" class="ax-btn ax-btn-ghost ax-btn-sm ax-mb-2" style="align-self:flex-start">
          <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span> Back to dashboard
        </button>
        <span class="ax-page-header-eyebrow">Support</span>
        <h1 class="ax-page-title">Tickets</h1>
        <p class="ax-page-subtitle">Customer and vendor support tickets.</p>
      </div>
    </header>

    <section class="ax-card ax-p-0">
      <app-ax-data-table [config]="config" [dataSource]="dataSource" (rowAction)="onRowAction($event)">
        <ng-template axCell="priority" let-row>
          <span class="ax-badge"
            [class.ax-badge-danger]="row.priority === 'urgent'"
            [class.ax-badge-warning]="row.priority === 'high'"
            [class.ax-badge-info]="row.priority === 'medium'"
            [class.ax-badge-neutral]="row.priority === 'low'">
            {{ row.priority | titlecase }}
          </span>
        </ng-template>
        <ng-template axCell="status" let-row>
          <span class="ax-badge"
            [class.ax-badge-info]="row.status === 'open'"
            [class.ax-badge-warning]="row.status === 'pending'"
            [class.ax-badge-success]="row.status === 'resolved'"
            [class.ax-badge-neutral]="row.status === 'closed'">
            {{ row.status | titlecase }}
          </span>
        </ng-template>
      </app-ax-data-table>
    </section>
  </div>
</app-admin-shell>
