<app-admin-shell>
  <div class="ax-container">
    <header class="ax-page-header">
      <div class="ax-page-header-content">
        <span class="ax-page-header-eyebrow">System</span>
        <h1 class="ax-page-title">Notification logs</h1>
        <p class="ax-page-subtitle">Delivery records for transactional notifications.</p>
      </div>
    </header>

    <section class="ax-card ax-p-0">
      <app-ax-data-table [config]="config" [dataSource]="dataSource">
        <ng-template axCell="status" let-row>
          <span class="ax-badge"
            [class.ax-badge-success]="row.status === 'sent'"
            [class.ax-badge-danger]="row.status === 'failed'">
            {{ row.status | titlecase }}
          </span>
        </ng-template>
      </app-ax-data-table>
    </section>
  </div>
</app-admin-shell>
