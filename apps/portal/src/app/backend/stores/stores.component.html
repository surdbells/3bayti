<app-admin-shell>
  <div class="ax-container">
    <header class="ax-page-header">
      <div class="ax-page-header-content">
        <button type="button" (click)="goBack()" class="ax-btn ax-btn-ghost ax-btn-sm ax-mb-2" style="align-self:flex-start">
          <app-icon name="arrow_back"></app-icon> Back to dashboard
        </button>
        <span class="ax-page-header-eyebrow">Platform</span>
        <h1 class="ax-page-title">Stores</h1>
        <p class="ax-page-subtitle">Manage vendor stores, approvals, and access.</p>
      </div>
    </header>

    <section class="ax-mb-4">
      <div class="ax-filter-grid">
        <label class="ax-field">
          <span class="ax-field-label">{{ 'stores.filter_status' | translate }}</span>
          <select class="ax-select" [(ngModel)]="filters.status" (change)="applyFilters()">
            <option value="">{{ 'stores.filter_status_any' | translate }}</option>
            <option value="pending">{{ 'stores.filter_status_pending' | translate }}</option>
            <option value="approved">{{ 'stores.filter_status_approved' | translate }}</option>
            <option value="suspended">{{ 'stores.filter_status_suspended' | translate }}</option>
          </select>
        </label>

        <label class="ax-field">
          <span class="ax-field-label">{{ 'stores.filter_active' | translate }}</span>
          <select class="ax-select" [(ngModel)]="filters.is_active" (change)="applyFilters()">
            <option value="">{{ 'stores.filter_any' | translate }}</option>
            <option value="true">{{ 'stores.filter_active_yes' | translate }}</option>
            <option value="false">{{ 'stores.filter_active_no' | translate }}</option>
          </select>
        </label>

        <label class="ax-field">
          <span class="ax-field-label">{{ 'stores.filter_verified' | translate }}</span>
          <select class="ax-select" [(ngModel)]="filters.is_verified" (change)="applyFilters()">
            <option value="">{{ 'stores.filter_any' | translate }}</option>
            <option value="true">{{ 'stores.filter_verified_yes' | translate }}</option>
            <option value="false">{{ 'stores.filter_verified_no' | translate }}</option>
          </select>
        </label>

        <label class="ax-field">
          <span class="ax-field-label">{{ 'stores.filter_featured' | translate }}</span>
          <select class="ax-select" [(ngModel)]="filters.is_featured" (change)="applyFilters()">
            <option value="">{{ 'stores.filter_any' | translate }}</option>
            <option value="true">{{ 'stores.filter_featured_yes' | translate }}</option>
            <option value="false">{{ 'stores.filter_featured_no' | translate }}</option>
          </select>
        </label>

        <label class="ax-field">
          <span class="ax-field-label">{{ 'stores.filter_emirate' | translate }}</span>
          <select class="ax-select" [(ngModel)]="filters.emirate" (change)="applyFilters()">
            <option value="">{{ 'stores.filter_emirate_any' | translate }}</option>
            <option *ngFor="let e of emirateOptions" [value]="e.value">{{ e.key | translate }}</option>
          </select>
        </label>

        <label class="ax-field">
          <span class="ax-field-label">{{ 'stores.filter_join_from' | translate }}</span>
          <input type="date" class="ax-input" [attr.placeholder]="'stores.filter_date_hint' | translate" [(ngModel)]="filters.created_from" (change)="applyFilters()" />
        </label>

        <label class="ax-field">
          <span class="ax-field-label">{{ 'stores.filter_join_to' | translate }}</span>
          <input type="date" class="ax-input" [attr.placeholder]="'stores.filter_date_hint' | translate" [(ngModel)]="filters.created_to" (change)="applyFilters()" />
        </label>

        <div class="ax-field ax-filter-actions">
          <button type="button" class="ax-btn ax-btn-ghost ax-btn-sm" (click)="clearFilters()">
            <app-icon name="close" aria-hidden="true"></app-icon> {{ 'stores.filter_clear' | translate }}
          </button>
        </div>
      </div>
    </section>

    <section class="ax-card ax-p-0">
      <app-ax-data-table
        [config]="config"
        [dataSource]="dataSource"
        (rowAction)="onRowAction($event)"
        (bulkAction)="onBulkAction($event)">

        <!-- Status badge -->
        <ng-template axCell="status" let-row>
          <span class="ax-badge" [class.ax-badge-success]="row.status" [class.ax-badge-neutral]="!row.status">
            {{ row.status ? 'Active' : 'Inactive' }}
          </span>
        </ng-template>

        <!-- Approval badge -->
        <ng-template axCell="approved" let-row>
          <span class="ax-badge" [class.ax-badge-success]="row.approved" [class.ax-badge-warning]="!row.approved">
            {{ row.approved ? 'Approved' : 'Pending' }}
          </span>
        </ng-template>
      </app-ax-data-table>
    </section>
  </div>
</app-admin-shell>
