<app-admin-shell>
  <div class="ax-container">
    <header class="ax-page-header">
      <div class="ax-page-header-content">
        <button type="button" (click)="goBack()" class="ax-btn ax-btn-ghost ax-btn-sm ax-mb-2" style="align-self:flex-start">
          <app-icon name="arrow_back" aria-hidden="true"></app-icon> Back to stores
        </button>
        <span class="ax-page-header-eyebrow">Store</span>
        <h1 class="ax-page-title">{{ store_name || 'Store' }} — Products</h1>
        <p class="ax-page-subtitle">Create, edit, and manage this store's products.</p>
      </div>
      <div class="ax-flex ax-gap-2 ax-items-center">
        <button type="button" class="ax-btn ax-btn-primary ax-btn-sm" (click)="openCreate()">
          <app-icon name="add" aria-hidden="true"></app-icon> New product
        </button>
      </div>
    </header>

    <section class="ax-card ax-p-0">
      <app-ax-data-table [config]="config" [dataSource]="dataSource" (rowAction)="onRowAction($event)">
        <ng-template axCell="stock_status" let-row>
          <span [ngClass]="stockBadge(row.stock_status)">{{ stockLabel(row.stock_status) }}</span>
        </ng-template>
      </app-ax-data-table>
    </section>
  </div>
</app-admin-shell>

<!-- Product create / edit drawer -->
<div *ngIf="drawerOpen()" class="ax-drawer-overlay" (click)="closeDrawer()"></div>
<aside *ngIf="drawerOpen()" class="ax-drawer ax-drawer-right ax-drawer-lg" role="dialog" aria-label="Product editor">
  <header class="ax-drawer-header">
    <div class="ax-drawer-header-content">
      <h2 class="ax-drawer-title">{{ editing() ? 'Edit product' : 'New product' }}</h2>
      <p class="ax-drawer-subtitle">{{ store_name }}</p>
    </div>
    <button type="button" class="ax-drawer-close" (click)="closeDrawer()" aria-label="Close">
      <app-icon name="close"></app-icon>
    </button>
  </header>

  <div class="ax-drawer-body">
    <div class="ax-form-field">
      <label class="ax-label">Name</label>
      <input type="text" class="ax-input" [(ngModel)]="form.name" placeholder="Product name" />
    </div>

    <div class="ax-form-field">
      <label class="ax-label">Description</label>
      <textarea class="ax-input" rows="3" [(ngModel)]="form.description" placeholder="Short description"></textarea>
    </div>

    <div class="ax-grid ax-grid-cols-2 ax-gap-3">
      <div class="ax-form-field">
        <label class="ax-label">Price (AED)</label>
        <input type="number" min="0" step="0.01" class="ax-input" [(ngModel)]="form.price" />
      </div>
      <div class="ax-form-field">
        <label class="ax-label">Stock quantity</label>
        <input type="number" min="0" step="1" class="ax-input" [(ngModel)]="form.stock_quantity" />
      </div>
    </div>

    <div class="ax-grid ax-grid-cols-2 ax-gap-3">
      <div class="ax-form-field">
        <label class="ax-label">Stock status</label>
        <select class="ax-input" [(ngModel)]="form.stock_status">
          <option value="in_stock">In stock</option>
          <option value="out_of_stock">Out of stock</option>
          <option value="on_backorder">On backorder</option>
        </select>
      </div>
      <div class="ax-form-field">
        <label class="ax-label">Status</label>
        <select class="ax-input" [(ngModel)]="form.status">
          <option value="published">Published</option>
          <option value="draft">Draft</option>
        </select>
      </div>
    </div>

    <div class="ax-form-field">
      <label class="ax-label">Category</label>
      <select class="ax-input" [(ngModel)]="form.category_id">
        <option [ngValue]="null">— Select category —</option>
        <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.name }}</option>
      </select>
    </div>

    <div class="ax-form-field">
      <label class="ax-label">Primary image URL</label>
      <input type="url" class="ax-input" [(ngModel)]="form.primary_image_url" placeholder="https://…" />
      <div *ngIf="form.primary_image_url" class="ax-mt-2">
        <img [src]="form.primary_image_url" alt="" class="spd-preview" />
      </div>
    </div>
  </div>

  <footer class="ax-drawer-footer">
    <button type="button" class="ax-btn ax-btn-ghost" (click)="closeDrawer()">Cancel</button>
    <button type="button" class="ax-btn ax-btn-primary" [disabled]="busy()" (click)="save()">
      <app-icon [name]="editing() ? 'save' : 'add'" aria-hidden="true"></app-icon>
      {{ editing() ? 'Save changes' : 'Create product' }}
    </button>
  </footer>
</aside>
